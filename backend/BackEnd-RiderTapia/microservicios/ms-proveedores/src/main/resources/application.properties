spring.application.name=ms-proveedores
server.port=9011

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ridertapia_proveedores?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Springdoc / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.springdoc-hateoas-enabled=false

# Microservicios consumidos
ms.productos.variantes-url=http://localhost:9005/api/v1/variantes
ms.inventario.items-url=http://localhost:9008/api/v1/items-inventario
ms.inventario.ingresos-url=http://localhost:9008/api/v1/ingresos
