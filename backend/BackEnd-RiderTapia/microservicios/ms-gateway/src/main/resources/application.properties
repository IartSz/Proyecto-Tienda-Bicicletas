spring.application.name=ms-gateway
server.port=9000

# Rutas fijas por URL (sin Eureka). Cada ruta manda el Path tal cual al microservicio,
# salvo las que tienen RewritePath porque el microservicio usa otra ruta.

# ms-usuario
spring.cloud.gateway.server.webflux.routes[0].id=ms-usuario
spring.cloud.gateway.server.webflux.routes[0].uri=${USUARIO_SERVICE_URL:http://localhost:9001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/usuarios/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/v1/usuarios(?<resto>.*), /api/usuarios$\{resto}

# ms-cliente
spring.cloud.gateway.server.webflux.routes[1].id=ms-cliente
spring.cloud.gateway.server.webflux.routes[1].uri=${CLIENTE_SERVICE_URL:http://localhost:9002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/clientes/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/v1/clientes(?<resto>.*), /api/clientes$\{resto}

# ms-soporte (las reseñas de soporte se piden en /api/v1/soporte/resenas y el microservicio las atiende en /api/v1/resenas)
spring.cloud.gateway.server.webflux.routes[2].id=ms-soporte
spring.cloud.gateway.server.webflux.routes[2].uri=${SOPORTE_SERVICE_URL:http://localhost:9003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/garantias/**,/api/v1/devoluciones/**,/api/v1/contactos/**,/api/v1/seguimientos/**,/api/v1/soporte/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/v1/soporte/resenas(?<resto>.*), /api/v1/resenas$\{resto}

# ms-reportes
spring.cloud.gateway.server.webflux.routes[3].id=ms-reportes
spring.cloud.gateway.server.webflux.routes[3].uri=${REPORTES_SERVICE_URL:http://localhost:9004}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/reportes/**,/api/v1/documentos/**

# ms-productos
spring.cloud.gateway.server.webflux.routes[4].id=ms-productos
spring.cloud.gateway.server.webflux.routes[4].uri=${PRODUCTOS_SERVICE_URL:http://localhost:9005}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/productos/**,/api/v1/categorias/**,/api/v1/marcas/**,/api/v1/variantes/**,/api/v1/imagenes/**,/api/v1/especificaciones/**,/api/v1/compatibilidades/**,/api/v1/ofertas/**,/api/v1/resenas/**,/api/v1/avisos-stock/**,/api/v1/cupones/**

# ms-pedidos
spring.cloud.gateway.server.webflux.routes[5].id=ms-pedidos
spring.cloud.gateway.server.webflux.routes[5].uri=${PEDIDOS_SERVICE_URL:http://localhost:9006}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/pedidos/**,/api/v1/detalles/**,/api/v1/historial-estados/**,/api/v1/boletas/**,/api/v1/facturas/**,/api/v1/notificaciones/**,/api/v1/visitantes/**

# ms-pagos
spring.cloud.gateway.server.webflux.routes[6].id=ms-pagos
spring.cloud.gateway.server.webflux.routes[6].uri=${PAGOS_SERVICE_URL:http://localhost:9007}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/pagos-webpay/**,/api/v1/pagos-transferencia/**,/api/v1/pagos-presenciales/**,/api/v1/cierres-caja/**

# ms-inventario (las cargas masivas viven aquí, no en ms-productos)
spring.cloud.gateway.server.webflux.routes[7].id=ms-inventario
spring.cloud.gateway.server.webflux.routes[7].uri=${INVENTARIO_SERVICE_URL:http://localhost:9008}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/items-inventario/**,/api/v1/movimientos/**,/api/v1/ingresos/**,/api/v1/ajustes/**,/api/v1/alertas-stock/**,/api/v1/tomas-inventario/**,/api/v1/detalles-conteo/**,/api/v1/cargas-masivas/**,/api/v1/errores-carga/**

# ms-carrito
spring.cloud.gateway.server.webflux.routes[8].id=ms-carrito
spring.cloud.gateway.server.webflux.routes[8].uri=${CARRITO_SERVICE_URL:http://localhost:9009}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/v1/carritos/**,/api/v1/items-carrito/**

# ms-servicio-tecnico (taller: órdenes de trabajo, repuestos y calificaciones)
spring.cloud.gateway.server.webflux.routes[9].id=ms-servicio-tecnico
spring.cloud.gateway.server.webflux.routes[9].uri=${SERVICIO_TECNICO_SERVICE_URL:http://localhost:9015}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/v1/tipos-servicio/**,/api/v1/bicicletas/**,/api/v1/solicitudes-servicio/**,/api/v1/fotos-solicitud/**,/api/v1/ordenes-trabajo/**,/api/v1/historial-estados-orden/**,/api/v1/repuestos-utilizados/**,/api/v1/notificaciones-taller/**,/api/v1/calificaciones-servicio/**

# ms-proveedores
spring.cloud.gateway.server.webflux.routes[10].id=ms-proveedores
spring.cloud.gateway.server.webflux.routes[10].uri=${PROVEEDORES_SERVICE_URL:http://localhost:9011}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/v1/proveedores/**,/api/v1/productos-proveedor/**,/api/v1/ordenes-compra/**,/api/v1/detalles-orden-compra/**,/api/v1/recepciones-compra/**,/api/v1/detalles-recepcion/**

# CORS global para el frontend (Live Server)
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5500,http://127.0.0.1:5500
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# Si un microservicio también responde cabeceras CORS (ej. @CrossOrigin), deja solo una
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
