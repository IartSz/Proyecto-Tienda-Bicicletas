<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Rider Tapia</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">

            <a href="index.html" class="auth-brand d-block mb-1">RIDER TAPIA </a>
            <p class="text-center text-muted mb-4" style="font-size:.9rem,">Ingresa a tu cuenta</p>


            <form id="loginForm" action="#" method="post" novalidate></form>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electronico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="tucorreo@ejemplo.com"
                        required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Pepetap1@" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 auth-links">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember" style="font-size:.85rem;">Recordarme</label>
                    </div>
                    <a href="forgot-password.html" style="font-size:.85rem;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-brand w-100 mb-3">INICIAR SESIÓN</button>

                <div class="text-center text-muted mb-2" style="font-size:.8rem;">¿No tienes cuenta?</div>
                <div class="text-center">
                    <a href="register.html" class="btn btn-dark px-4">CREAR CUENTA</a>
                </div>
                </form>

            </div>

        </div>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

</body>

</html>
