<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Rider Tapia</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <a href="../index.html" class="auth-brand d-block mb-1">RIDER TAPIA <span>BIKER</span></a>
            <p class="text-center text-muted mb-4" style="font-size:.9rem;">Recupera tu contraseña</p>

            <p class="text-center text-muted mb-4" style="font-size:.85rem;">
                Ingresa el correo con el que te registraste y te enviaremos un enlace para
                crear una nueva contraseña.
            </p>

            <!--
      IMPORTANTE: para que funcione, este form debe enviar el correo a un backend que:
      1) verifique que el correo existe, 2) genere un token único con vencimiento,
      3) envíe un email con un enlace tipo reset-password.html?token=XXXX.
      Cambia action/method por la ruta de tu servidor (ej: action="/forgot-password" method="post").
    -->
            <form id="forgotForm" action="login.html" method="get">

                <div class="mb-4">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                            placeholder="tucorreo@ejemplo.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand w-100 mb-3">ENVIAR ENLACE</button>

                <!-- Mensaje de confirmación (se muestra tras enviar; el backend real decide esto) -->
                <div class="alert alert-success text-center d-none" id="sentMsg" style="font-size:.85rem;">
                    Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña.
                </div>

                <p class="text-center mb-0 auth-links" style="font-size:.9rem;">
                    <a href="login.html"><i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión</a>
                </p>
            </form>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

</body>

</html>
